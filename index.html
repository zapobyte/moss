    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {

                light: '#98b08b', // Sage

            fontFamily: {
              sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
            }
          }
        }

    <style>
      /* Custom scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }

        background: #4a6741;

      }
      ::-webkit-scrollbar-thumb:hover {

        overflow-x: hidden;
